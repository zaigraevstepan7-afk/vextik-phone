name: build

on:
  push:
    branches:
      - 'claude/**'
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            abi: arm64-v8a
          - name: x86-64
            abi: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Resolve NDK
        id: ndk
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$ANDROID_NDK_ROOT"
          fi
          echo "Using NDK at: $NDK"
          test -d "$NDK"
          echo "path=$NDK" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B "build/${{ matrix.abi }}" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "build/${{ matrix.abi }}" --parallel

      - name: Stage artifact
        run: |
          mkdir -p out
          cp "build/${{ matrix.abi }}/HASLINE.sh" "out/HASLINE_${{ matrix.name }}"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HASLINE_${{ matrix.name }}
          path: out/HASLINE_${{ matrix.name }}
          if-no-files-found: error

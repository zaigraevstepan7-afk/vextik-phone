name: Build

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125'

      - name: Setup Ninja
        run: sudo apt-get install -y ninja-build

      - name: Build arm64-v8a
        run: |
          cmake -S . -B build/arm64-v8a -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/arm64-v8a --parallel $(nproc)

      - name: Build x86_64
        run: |
          cmake -S . -B build/x86_64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/x86_64 --parallel $(nproc)

      - name: Upload arm64
        uses: actions/upload-artifact@v4
        with:
          name: HASLINE-arm64
          path: build/arm64-v8a/HASLINE.sh
          if-no-files-found: error

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: HASLINE-x86_64
          path: build/x86_64/HASLINE.sh
          if-no-files-found: error
